services:
  postgres:
    image: postgres:16-alpine
    container_name: nextjs-starter-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: nextjs_starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
